<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Map — 음식점·카페 평점 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <div class="control-group">
      <label class="toggle">
        <input type="checkbox" id="chk-food" checked />
        <span class="chip food">음식점</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="chk-cafe" checked />
        <span class="chip cafe">카페</span>
      </label>
    </div>
    <div class="control-group">
      <label for="min-rating">카카오 평점</label>
      <select id="min-rating">
        <option value="0">전체</option>
        <option value="3.5">3.5+</option>
        <option value="4.0">4.0+</option>
        <option value="4.5">4.5+</option>
      </select>
    </div>
    <div id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
